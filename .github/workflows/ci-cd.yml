# ExpenseFlow CI/CD (devops.md sec 10)
# PR/push: lint -> secrets scan -> backend tests -> frontend build -> dependency check -> build, scan, stack up,
#          integration tests, SBOM -> k6 smoke (main only)
# Tag v*:  release with a manual approval gate (environment "production", required reviewer)
name: ci-cd

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_IMAGE: aquasec/trivy:0.57.1
  TAG: ${{ github.sha }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint (3 Dockerfiles)
        run: |
          for f in backend/Dockerfile frontend/Dockerfile gateway/Dockerfile; do
            echo "::group::$f"; docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold error - < "$f"; echo "::endgroup::"
          done
      - name: compose config
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
      - name: shell syntax
        run: bash -n tests/integration.sh

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner --redact

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25", cache: maven }
      - name: mvn verify (unit + Testcontainers)
        working-directory: backend
        run: mvn -B verify      # runner Maven 3.9; the committed wrapper points at a bundled Windows-checked-out dist
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: surefire-reports, path: backend/target/surefire-reports, if-no-files-found: ignore }

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: echo "app=$([ -f frontend/package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.has.outputs.app == 'yes'
        with: { node-version: "26" }
      - name: build
        if: steps.has.outputs.app == 'yes'
        working-directory: frontend
        run: npm ci && npm run build
      - name: npm audit (report only)
        if: steps.has.outputs.app == 'yes'
        working-directory: frontend
        run: npm audit --audit-level=high || true
      - if: steps.has.outputs.app == 'no'
        run: echo "frontend/package.json not present yet – placeholder page is served"

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs (fixable HIGH/CRITICAL fail the build)
        run: docker run --rm -v "$PWD:/repo" $TRIVY_IMAGE fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /repo

  build-scan-test:
    needs: [lint, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: secret file
        run: mkdir -p secrets && printf 'app' > secrets/db_password.txt
      - name: build images
        run: docker compose build
      - name: Trivy image scan
        run: |
          for s in backend frontend gateway; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock $TRIVY_IMAGE image \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "expenseflow/$s:$TAG"
          done
      - name: SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          for s in backend frontend gateway; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" $TRIVY_IMAGE image \
              --format cyclonedx --output "/out/sbom-$s.cdx.json" "expenseflow/$s:$TAG"
          done
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom }
      - name: stack up (2 backend replicas)
        run: docker compose up -d --wait --wait-timeout 300 && docker compose ps
      - name: integration tests
        run: bash tests/integration.sh
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

  load-test:
    if: github.ref == 'refs/heads/main'
    needs: [build-scan-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p secrets evidence && chmod 777 evidence && printf 'app' > secrets/db_password.txt
      - run: docker compose build && docker compose up -d --wait --wait-timeout 300
      - name: k6 smoke 30 s against the backend replicas
        run: docker compose --profile loadtest run --rm -e TARGET=http://backend:8080 -e VUS=20 -e DURATION=30s -e NAME=ci-smoke k6
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: k6-summary, path: evidence/k6-*.json, if-no-files-found: ignore }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-scan-test, secrets-scan, dependency-check]
    runs-on: ubuntu-latest
    environment: production          # Settings -> Environments -> production -> Required reviewers (approval gate)
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p secrets sbom && printf 'app' > secrets/db_password.txt
      - name: build images tagged with the version
        run: docker compose build
      - name: SBOM
        run: |
          for s in backend frontend gateway; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" $TRIVY_IMAGE image \
              --format cyclonedx --output "/out/sbom-$s.cdx.json" "expenseflow/$s:$TAG"
          done
      - name: smoke test the release
        run: docker compose up -d --wait --wait-timeout 300 && bash tests/integration.sh
      - uses: softprops/action-gh-release@v3
        with:
          files: sbom/*.json
          generate_release_notes: true
