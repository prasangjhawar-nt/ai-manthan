# Static SPA server behind the gateway (gateway adds security headers and rate limits).
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: deep links like /claims/42 load the app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
