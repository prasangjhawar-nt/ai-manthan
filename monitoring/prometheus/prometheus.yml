# devops.md 8.1 – 5 s intervals so the bank alert fires inside the 45 s demo slot (demo-breaker 3)
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

# Alertmanager (X9, STRETCH) not running: no `alerting:` block. Alerts are visible at /alerts and in Grafana.

scrape_configs:
  - job_name: backend            # every replica via Docker DNS (demo-breaker 8)
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [backend]
        type: A
        port: 8080
        refresh_interval: 10s

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: blackbox           # X4 synthetic checks through the gateway
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://gateway:8080/healthz", "http://gateway:8080/"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
