# devops.md 8.2 / README 9.4. DB-based gauges are reported by every replica → max(); counters → sum().
groups:
  - name: expenseflow
    rules:
      - alert: OldestPendingApprovalTooOld
        expr: max(expenseflow_oldest_pending_seconds) > 48 * 3600
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Oldest pending approval is {{ $value | humanizeDuration }} old"
          runbook: "docs/runbook.md#oldest-pending-approval"

      - alert: BankPayoutFailing
        expr: max(expenseflow_payout_pending_batches) > 0
        for: 0s
        labels: { severity: critical }
        annotations:
          summary: "{{ $value }} payout batch(es) waiting for the bank"
          runbook: "docs/runbook.md#bank-down"

      - alert: BankCallErrors
        expr: sum(increase(expenseflow_bank_call_seconds_count{outcome="FAILURE"}[1m])) > 0
        for: 0s
        labels: { severity: critical }
        annotations:
          summary: "Bank calls are failing"
          runbook: "docs/runbook.md#bank-down"

      - alert: BackendReplicaDown
        expr: count(up{job="backend"} == 0) > 0
        for: 10s
        labels: { severity: warning }
        annotations:
          summary: "A backend replica is down; traffic is on the remaining replicas"

      - alert: BackendDown
        expr: sum(up{job="backend"}) == 0 or absent(up{job="backend"})
        for: 15s
        labels: { severity: critical }
        annotations:
          summary: "No backend replica is up"

      - alert: AppUnreachable
        expr: min(probe_success{job="blackbox"}) == 0
        for: 15s
        labels: { severity: critical }
        annotations:
          summary: "Synthetic check failed: {{ $labels.instance }}"

      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*",status=~"5.."}[1m]))
            / sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[1m])) > 0.05
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "5xx above 5%"

      # needs >= 1 req/s: at demo-level traffic one 3 s bank-timeout request would otherwise be "the p95"
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[2m]))) > 1
            and on() sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[2m])) >= 1
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "API p95 above 1 s"

      - alert: SLOErrorBudgetFastBurn
        expr: |
          (sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*",status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m])), 1)) > (14.4 * 0.005)
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Availability SLO burning error budget 14x too fast"
