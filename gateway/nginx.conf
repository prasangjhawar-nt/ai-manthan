worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # read-only container: all temp paths in /tmp (tmpfs)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # first, so the $req_id map exists before log_format uses it
    include /etc/nginx/conf.d/*.conf;

    log_format json escape=json
        '{"ts":"$time_iso8601","requestId":"$req_id","remote":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"rt":$request_time,'
        '"upstream":"$upstream_addr","urt":"$upstream_response_time"}';
    access_log /dev/stdout json;

    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;
}
