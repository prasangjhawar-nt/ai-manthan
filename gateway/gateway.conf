# ExpenseFlow gateway: the only public port. Load-balances 2+ backend replicas (devops.md 5),
# rate limits (FR-AUTH-2), security headers, /actuator not routed (NFR-SEC-6), X-Request-ID.

resolver 127.0.0.11 valid=10s ipv6=off;        # Docker DNS, re-resolve every 10 s

upstream backend_upstream {
    zone backend_upstream 64k;
    server backend:8080 resolve max_fails=2 fail_timeout=10s;
    keepalive 32;
}

upstream frontend_upstream {
    zone frontend_upstream 64k;
    server frontend:8080 resolve;
}

# keep the client's X-Request-ID, otherwise generate one
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
limit_req_status 429;

server {
    listen 8080;
    client_max_body_size 6m;

    add_header X-Request-ID           $req_id always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-src 'self' blob:; object-src 'self' blob:; frame-ancestors 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $req_id;
    proxy_hide_header X-Request-ID;       # the gateway adds it once (add_header above); no "id, id" on /api
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_next_upstream   error timeout http_502 http_503;   # skip a failing replica (non-idempotent POSTs are not retried)

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /actuator { return 404; }

    location = /api/auth/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://backend_upstream;
    }

    # Swagger UI at /api/swagger-ui.html (README sec 0); springdoc serves its assets at the root paths below
    location = /api/swagger-ui.html { proxy_pass http://backend_upstream/swagger-ui.html; }
    location /swagger-ui/           { proxy_pass http://backend_upstream; }
    location /v3/api-docs           { proxy_pass http://backend_upstream; }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend_upstream;
    }

    location / {
        proxy_pass http://frontend_upstream;
    }
}

# stub_status for nginx-prometheus-exporter (internal network only, port not published)
server {
    listen 8081;
    access_log off;
    location = /stub_status { stub_status; }
}
