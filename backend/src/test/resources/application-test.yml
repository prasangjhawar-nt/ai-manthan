spring:
  datasource:
    url: jdbc:tc:postgresql:18-alpine:///expenseflow_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

expenseflow:
  jwt:
    secret: test-secret-at-least-32-bytes-long-xxxxxxxxxxxxxx
    ttl-minutes: 60
  bank:
    base-url: http://localhost:0
    timeout-ms: 1000
  payout:
    retry-interval-ms: 60000

management:
  endpoint:
    health:
      show-details: always
