  schemas:
    # ---------- enums (exactly as README) ----------
    Role:
      type: string
      enum: [EMPLOYEE, MANAGER, AUDITOR, HEAD]
    ClaimStatus:
      type: string
      enum: [DRAFT, SUBMITTED, PENDING_MANAGER, PENDING_AUDITOR, PENDING_HEAD, NEEDS_CLARIFICATION, APPROVED, REJECTED, IN_PAYOUT, PAID]
    Category:
      type: string
      enum: [MEALS, HOTEL, LOCAL_CAB, FLIGHT, TRAIN, OTHER]
    Flag:
      type: string
      enum: [OVER_LIMIT, MISSING_RECEIPT, DUPLICATE, WEEKEND, NO_POLICY]
    LineOutcome:
      type: string
      enum: [AUTO_APPROVE, ROUTE, AUTO_REJECT]
    ApprovalLevel:
      type: string
      enum: [MANAGER, AUDITOR, HEAD]
    Decision:
      type: string
      enum: [APPROVED, SENT_BACK, REJECTED]
    SampleAuditStatus:
      type: string
      enum: [NONE, OPEN, CLEARED, FAILED]
    PayoutBatchStatus:
      type: string
      enum: [PENDING_SEND, SENT]
    Money:
      type: number
      minimum: 0
      multipleOf: 0.01
      description: INR, 2 decimals

    # ---------- errors ----------
    ProblemDetail:
      type: object
      description: RFC 9457 problem details. No stack traces.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string, description: Same as the X-Request-ID response header }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }

    # ---------- auth ----------
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 120 }
        password: { type: string, minLength: 1, maxLength: 100 }
    LoginResponse:
      type: object
      required: [token, tokenType, expiresInSeconds, user]
      properties:
        token: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresInSeconds: { type: integer }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, employeeCode, name, email, role, departmentId, departmentName]
      properties:
        id: { type: integer, format: int64 }
        employeeCode: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        departmentId: { type: integer, format: int64 }
        departmentName: { type: string }
        managerId: { type: [integer, 'null'], format: int64 }

    # ---------- claims ----------
    ClaimLineInput:
      type: object
      required: [category, expenseDate, amount, vendor]
      properties:
        category: { $ref: '#/components/schemas/Category' }
        expenseDate: { type: string, format: date, description: Not in the future, not older than 90 days }
        amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          exclusiveMinimum: 0
          maximum: 1000000
        vendor: { type: string, minLength: 1, maxLength: 120 }
        city: { type: [string, 'null'], maxLength: 80, description: Required for HOTEL }
        nights: { type: [integer, 'null'], minimum: 1, maximum: 30, description: Required for HOTEL }
        description: { type: [string, 'null'], maxLength: 500 }
        receiptId: { type: [integer, 'null'], format: int64 }
    ClaimLine:
      type: object
      required: [id, lineNo, category, expenseDate, amount, vendor, flags]
      properties:
        id: { type: integer, format: int64 }
        lineNo: { type: integer }
        category: { $ref: '#/components/schemas/Category' }
        expenseDate: { type: string, format: date }
        amount: { $ref: '#/components/schemas/Money' }
        vendor: { type: string }
        city: { type: [string, 'null'] }
        nights: { type: [integer, 'null'] }
        description: { type: [string, 'null'] }
        receiptId: { type: [integer, 'null'], format: int64 }
        outcome:
          oneOf:
            - { $ref: '#/components/schemas/LineOutcome' }
            - { type: 'null' }
          description: Null while DRAFT
        flags:
          type: array
          items: { $ref: '#/components/schemas/Flag' }
        reason: { type: [string, 'null'] }
    ClaimCreateRequest:
      type: object
      required: [title, lines]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        lines:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/ClaimLineInput' }
    ClaimUpdateRequest:
      type: object
      required: [version, title, lines]
      properties:
        version: { type: integer, description: Optimistic lock; stale value returns 409 }
        title: { type: string, minLength: 1, maxLength: 120 }
        lines:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/ClaimLineInput' }
    ApprovalStep:
      type: object
      required: [id, level, approverId, actedById, decision, decidedAt]
      properties:
        id: { type: integer, format: int64 }
        level: { $ref: '#/components/schemas/ApprovalLevel' }
        approverId: { type: integer, format: int64, description: Approver of record (on behalf of) }
        approverName: { type: string }
        actedById: { type: integer, format: int64, description: Differs from approverId when a delegate acted }
        actedByName: { type: string }
        decision: { $ref: '#/components/schemas/Decision' }
        comment: { type: [string, 'null'] }
        decidedAt: { type: string, format: date-time }
    Claim:
      type: object
      required: [id, claimNumber, employeeId, employeeName, title, status, totalAmount, sampleAudit, version, createdAt, updatedAt, lines, approvalSteps]
      properties:
        id: { type: integer, format: int64 }
        claimNumber: { type: string, pattern: '^EXP-\d{4}-\d{6}$' }
        employeeId: { type: integer, format: int64 }
        employeeName: { type: string }
        departmentName: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        totalAmount: { $ref: '#/components/schemas/Money' }
        currentLevel:
          oneOf:
            - { $ref: '#/components/schemas/ApprovalLevel' }
            - { type: 'null' }
        sampleAudit: { $ref: '#/components/schemas/SampleAuditStatus' }
        submittedAt: { type: [string, 'null'], format: date-time }
        finalDecisionAt: { type: [string, 'null'], format: date-time }
        paidAt: { type: [string, 'null'], format: date-time }
        payoutBatchId: { type: [integer, 'null'], format: int64 }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: '#/components/schemas/ClaimLine' }
        approvalSteps:
          type: array
          items: { $ref: '#/components/schemas/ApprovalStep' }
    ClaimSummary:
      type: object
      required: [id, claimNumber, title, status, totalAmount, employeeId, employeeName, flags, sampleAudit]
      properties:
        id: { type: integer, format: int64 }
        claimNumber: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        totalAmount: { $ref: '#/components/schemas/Money' }
        employeeId: { type: integer, format: int64 }
        employeeName: { type: string }
        departmentName: { type: string }
        submittedAt: { type: [string, 'null'], format: date-time }
        flags:
          type: array
          description: Distinct flags across the claim's lines
          items: { $ref: '#/components/schemas/Flag' }
        sampleAudit: { $ref: '#/components/schemas/SampleAuditStatus' }
        currentLevel:
          oneOf:
            - { $ref: '#/components/schemas/ApprovalLevel' }
            - { type: 'null' }
        waitingHours: { type: [number, 'null'], description: Hours at the current level }
    ClaimSummaryPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ClaimSummary' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    # ---------- receipts ----------
    ReceiptUpload:
      type: object
      required: [id, fileName, contentType, sizeBytes, sha256, uploadedAt]
      properties:
        id: { type: integer, format: int64 }
        fileName: { type: string }
        contentType: { type: string, enum: [image/jpeg, image/png, application/pdf] }
        sizeBytes: { type: integer, maximum: 5242880 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        duplicateOfReceiptId: { type: [integer, 'null'], format: int64, description: Set when the same hash already exists }
        uploadedAt: { type: string, format: date-time }

    # ---------- approvals ----------
    ApproveRequest:
      type: object
      properties:
        comment: { type: [string, 'null'], maxLength: 1000 }
    SendBackRequest:
      type: object
      required: [comment]
      properties:
        comment: { type: string, minLength: 1, maxLength: 1000 }
    RejectRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    BulkApproveRequest:
      type: object
      required: [claimIds]
      properties:
        claimIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: integer, format: int64 }
        comment: { type: [string, 'null'], maxLength: 1000 }
    BulkApproveResult:
      type: object
      required: [claimId, outcome]
      properties:
        claimId: { type: integer, format: int64 }
        claimNumber: { type: [string, 'null'] }
        outcome: { type: string, enum: [APPROVED, PENDING_HEAD, SKIPPED] }
        newStatus:
          oneOf:
            - { $ref: '#/components/schemas/ClaimStatus' }
            - { type: 'null' }
        errorStatus: { type: [integer, 'null'], description: 'HTTP-like code when SKIPPED (403, 404, 409)' }
        errorDetail: { type: [string, 'null'] }
    BulkApproveResponse:
      type: object
      required: [processed, succeeded, failed, results]
      properties:
        processed: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        results:
          type: array
          items: { $ref: '#/components/schemas/BulkApproveResult' }
    SampleAuditRequest:
      type: object
      required: [result]
      properties:
        result: { type: string, enum: [CLEARED, FAILED] }
        reason: { type: [string, 'null'], maxLength: 1000, description: Required when FAILED }

    # ---------- comments, audit, delegation ----------
    CommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 1000 }
    Comment:
      type: object
      required: [id, claimId, authorId, authorName, authorRole, body, createdAt]
      properties:
        id: { type: integer, format: int64 }
        claimId: { type: integer, format: int64 }
        authorId: { type: integer, format: int64 }
        authorName: { type: string }
        authorRole: { $ref: '#/components/schemas/Role' }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, actorId, action, entityType, entityId, createdAt]
      properties:
        id: { type: integer, format: int64 }
        actorId: { type: integer, format: int64 }
        actorName: { type: string }
        onBehalfOfId: { type: [integer, 'null'], format: int64 }
        onBehalfOfName: { type: [string, 'null'] }
        action:
          type: string
          enum: [CLAIM_CREATED, CLAIM_UPDATED, CLAIM_SUBMITTED, POLICY_EVALUATED, CLAIM_APPROVED, CLAIM_SENT_BACK, CLAIM_REJECTED, SAMPLE_AUDIT_CLEARED, SAMPLE_AUDIT_FAILED, COMMENT_ADDED, RECEIPT_UPLOADED, DELEGATION_CREATED, PAYOUT_BATCH_CREATED, PAYOUT_SEND_FAILED, PAYOUT_SENT, CLAIM_PAID, LOGIN, SEEDED]
        entityType: { type: string, enum: [CLAIM, RECEIPT, DELEGATION, PAYOUT_BATCH, USER] }
        entityId: { type: integer, format: int64 }
        claimId: { type: [integer, 'null'], format: int64 }
        fromStatus:
          oneOf:
            - { $ref: '#/components/schemas/ClaimStatus' }
            - { type: 'null' }
        toStatus:
          oneOf:
            - { $ref: '#/components/schemas/ClaimStatus' }
            - { type: 'null' }
        details: { type: [object, 'null'], additionalProperties: true }
        correlationId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    DelegationRequest:
      type: object
      required: [delegateId, fromDate, toDate]
      properties:
        delegateId: { type: integer, format: int64 }
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date, description: Must be on or after fromDate }
    Delegation:
      type: object
      required: [id, approverId, delegateId, fromDate, toDate, active, createdAt]
      properties:
        id: { type: integer, format: int64 }
        approverId: { type: integer, format: int64 }
        approverName: { type: string }
        delegateId: { type: integer, format: int64 }
        delegateName: { type: string }
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
        active: { type: boolean, description: Today is within fromDate..toDate }
        createdAt: { type: string, format: date-time }

    # ---------- payouts ----------
    PayoutBatchRequest:
      type: object
      required: [claimIds]
      properties:
        claimIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: { type: integer, format: int64 }
    PayoutBatch:
      type: object
      required: [id, batchRef, status, claimCount, totalAmount, fileName, attempts, createdById, createdAt]
      properties:
        id: { type: integer, format: int64 }
        batchRef: { type: string, pattern: '^PB-\d{8}-\d{3}$' }
        status: { $ref: '#/components/schemas/PayoutBatchStatus' }
        claimCount: { type: integer }
        totalAmount: { $ref: '#/components/schemas/Money' }
        fileName: { type: string }
        attempts: { type: integer }
        lastError: { type: [string, 'null'] }
        bankReference: { type: [string, 'null'] }
        createdById: { type: integer, format: int64 }
        createdByName: { type: string }
        createdAt: { type: string, format: date-time }
        sentAt: { type: [string, 'null'], format: date-time }
        claims:
          type: [array, 'null']
          description: Filled on detail and create responses, null in lists
          items: { $ref: '#/components/schemas/ClaimSummary' }
    PayoutBatchPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/PayoutBatch' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    # ---------- dashboard ----------
    DashboardSummary:
      type: object
      required: [from, to, kpis, spendByCategory, spendByDepartment, spendByMonth, violationsByFlag, exceptions]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        kpis:
          type: object
          required: [pendingByLevel, oldestPendingHours, policyViolations, avgApprovalHours, totalPaid]
          properties:
            pendingByLevel:
              type: object
              required: [MANAGER, AUDITOR, HEAD]
              properties:
                MANAGER: { type: integer }
                AUDITOR: { type: integer }
                HEAD: { type: integer }
            oldestPendingHours: { type: [number, 'null'] }
            policyViolations: { type: integer, description: Flagged lines in the period }
            avgApprovalHours: { type: [number, 'null'], description: Submit to final approval }
            totalPaid: { $ref: '#/components/schemas/Money' }
        spendByCategory:
          type: array
          items:
            type: object
            required: [category, amount]
            properties:
              category: { $ref: '#/components/schemas/Category' }
              amount: { $ref: '#/components/schemas/Money' }
        spendByDepartment:
          type: array
          items:
            type: object
            required: [departmentId, departmentName, amount]
            properties:
              departmentId: { type: integer, format: int64 }
              departmentName: { type: string }
              amount: { $ref: '#/components/schemas/Money' }
        spendByMonth:
          type: array
          items:
            type: object
            required: [month, amount]
            properties:
              month: { type: string, pattern: '^\d{4}-\d{2}$' }
              amount: { $ref: '#/components/schemas/Money' }
        violationsByFlag:
          type: array
          items:
            type: object
            required: [flag, count]
            properties:
              flag: { $ref: '#/components/schemas/Flag' }
              count: { type: integer }
        exceptions:
          type: array
          description: 10 oldest pending claims
          items: { $ref: '#/components/schemas/ClaimSummary' }

    # ---------- policy ----------
    PolicyRule:
      type: object
      required: [id, code, category, limitAmount, unit, active]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        limitAmount: { $ref: '#/components/schemas/Money' }
        unit: { type: string, enum: [PER_DAY, PER_NIGHT, PER_TRIP] }
        cityTier: { type: [integer, 'null'], description: '1 = tier-1, 2 = other; null = any city' }
        active: { type: boolean }
        description: { type: string }
    PolicyConfig:
      type: object
      required: [rules, settings, tier1Cities]
      properties:
        rules:
          type: array
          items: { $ref: '#/components/schemas/PolicyRule' }
        settings:
          type: array
          items:
            type: object
            required: [key, value]
            properties:
              key: { type: string }
              value: { type: string }
              description: { type: string }
        tier1Cities:
          type: array
          items: { type: string }
