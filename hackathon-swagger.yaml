openapi: 3.1.0
info:
  title: ExpenseFlow API
  version: 1.0.0
  description: |
    Team 45 · AI Manthan 2026 · Track A. Contract for ExpenseFlow (README.md sections 4–7).
    LOCKED at T+35 as contract-v1. Only additive changes after that (Dipesh only).
    All amounts are INR with 2 decimals. Timestamps are UTC (ISO 8601).
servers:
  - url: http://localhost:8080
    description: nginx gateway (Docker)
  - url: http://localhost:4010
    description: Prism mock
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Claims
  - name: Receipts
  - name: Approvals
  - name: Comments
  - name: Audit
  - name: Delegations
  - name: Payouts
  - name: Dashboard
  - name: Policy

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with email and password, get a JWT
      x-roles: [PUBLIC]
      x-story: ST-01
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: emp.demo@expenseflow.test, password: Demo@123 }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
              example:
                token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMDEiLCJyb2xlIjoiRU1QTE9ZRUUifQ.c2lnbmF0dXJl
                tokenType: Bearer
                expiresInSeconds: 3600
                user: { id: 101, employeeCode: E0101, name: Asha Verma, email: emp.demo@expenseflow.test, role: EMPLOYEE, departmentId: 1, departmentName: Engineering, managerId: 21 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Current user profile
      x-roles: [EMPLOYEE, MANAGER, AUDITOR, HEAD]
      x-story: ST-01
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example: { id: 101, employeeCode: E0101, name: Asha Verma, email: emp.demo@expenseflow.test, role: EMPLOYEE, departmentId: 1, departmentName: Engineering, managerId: 21 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/claims:
    get:
      tags: [Claims]
      operationId: listMyClaims
      summary: List the caller's own claims
      x-roles: [EMPLOYEE, MANAGER, AUDITOR, HEAD]
      x-story: ST-04
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ClaimStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of own claims
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimSummaryPage' }
              example:
                content:
                  - { id: 123, claimNumber: EXP-2026-000123, title: Mumbai client visit, status: PENDING_MANAGER, totalAmount: 30500.00, employeeId: 101, employeeName: Asha Verma, departmentName: Engineering, submittedAt: '2026-11-27T06:15:00Z', flags: [OVER_LIMIT, WEEKEND, NO_POLICY], sampleAudit: NONE, currentLevel: MANAGER, waitingHours: 0.5 }
                  - { id: 98, claimNumber: EXP-2026-000098, title: Team lunch Pune, status: PAID, totalAmount: 1350.00, employeeId: 101, employeeName: Asha Verma, departmentName: Engineering, submittedAt: '2026-11-02T09:40:00Z', flags: [], sampleAudit: NONE, currentLevel: null, waitingHours: null }
                page: 0
                size: 20
                totalElements: 2
                totalPages: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    post:
      tags: [Claims]
      operationId: createClaim
      summary: Create a claim as DRAFT
      x-roles: [EMPLOYEE, MANAGER, AUDITOR, HEAD]
      x-story: ST-02
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimCreateRequest' }
            example:
              title: Mumbai client visit
              lines:
                - { category: HOTEL, expenseDate: '2026-11-18', amount: 22500.00, vendor: Hotel Sea Pearl, city: Mumbai, nights: 3, description: 3 nights near client office, receiptId: 501 }
                - { category: MEALS, expenseDate: '2026-11-19', amount: 1200.00, vendor: Cafe Madras, city: Mumbai, receiptId: 502 }
                - { category: LOCAL_CAB, expenseDate: '2026-11-21', amount: 800.00, vendor: Ola, city: Mumbai, receiptId: 503 }
                - { category: FLIGHT, expenseDate: '2026-11-18', amount: 6000.00, vendor: IndiGo, city: Mumbai, receiptId: 504 }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
              examples:
                draftClaim: { $ref: '#/components/examples/DraftClaim' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/claims/{id}:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    get:
      tags: [Claims]
      operationId: getClaim
      summary: Claim detail with lines, flags and approval steps
      x-roles: [EMPLOYEE, MANAGER, AUDITOR, HEAD]
      x-story: ST-02
      responses:
        '200':
          description: Claim detail (only if visible to the caller, else 404)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
              examples:
                pendingManager: { $ref: '#/components/examples/PendingManagerClaim' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    put:
      tags: [Claims]
      operationId: updateClaim
      summary: Replace title and lines (owner, DRAFT or NEEDS_CLARIFICATION only)
      x-roles: [EMPLOYEE, MANAGER, AUDITOR, HEAD]
      x-story: ST-02
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimUpdateRequest' }
            example:
              version: 0
              title: Mumbai client visit
              lines:
                - { category: HOTEL, expenseDate: '2026-11-18', amount: 22500.00, vendor: Hotel Sea Pearl, city: Mumbai, nights: 3, receiptId: 501 }
                - { category: MEALS, expenseDate: '2026-11-19', amount: 1200.00, vendor: Cafe Madras, city: Mumbai, receiptId: 502 }
      responses:
        '200':
          description: Updated claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
              examples:
                draftClaim: { $ref: '#/components/examples/DraftClaim' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/claims/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    post:
      tags: [Claims]
      operationId: submitClaim
      summary: Submit (or resubmit) a claim; runs the policy engine
      description: Same Idempotency-Key + same user returns the stored response and creates nothing new.
      x-roles: [EMPLOYEE, MANAGER, AUDITOR, HEAD]
      x-story: ST-03
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Submitted; status is REJECTED, APPROVED, PENDING_MANAGER or PENDING_AUDITOR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
              examples:
                pendingManager: { $ref: '#/components/examples/PendingManagerClaim' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/receipts:
    post:
      tags: [Receipts]
      operationId: uploadReceipt
      summary: Upload a receipt (JPEG, PNG or PDF, max 5 MB)
      x-roles: [EMPLOYEE, MANAGER, AUDITOR, HEAD]
      x-story: ST-02
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Stored with its SHA-256 hash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptUpload' }
              example: { id: 501, fileName: hotel-sea-pearl.pdf, contentType: application/pdf, sizeBytes: 184320, sha256: 9f2b5c1e8d7a4b3c2f1e0d9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b9a, duplicateOfReceiptId: null, uploadedAt: '2026-11-27T06:10:00Z' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /api/receipts/{id}/content:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
        example: 501
    get:
      tags: [Receipts]
      operationId: getReceiptContent
      summary: Stream the receipt file (same visibility as its claim)
      x-roles: [EMPLOYEE, MANAGER, AUDITOR, HEAD]
      x-story: ST-05
      responses:
        '200':
          description: The file
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/approvals/queue:
    get:
      tags: [Approvals]
      operationId: getApprovalQueue
      summary: Role-specific approval queue, oldest first
      description: |
        MANAGER: PENDING_MANAGER claims of direct reports and active delegators.
        AUDITOR: PENDING_AUDITOR claims plus APPROVED claims with an OPEN sample audit.
        HEAD: PENDING_HEAD claims.
      x-roles: [MANAGER, AUDITOR, HEAD]
      x-story: ST-07
      parameters:
        - { name: departmentId, in: query, schema: { type: integer, format: int64 } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - { name: flag, in: query, schema: { $ref: '#/components/schemas/Flag' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ClaimStatus' } }
        - { name: minAmount, in: query, schema: { type: number, minimum: 0 } }
        - { name: maxAmount, in: query, schema: { type: number, minimum: 0 } }
        - { name: submittedFrom, in: query, schema: { type: string, format: date } }
        - { name: submittedTo, in: query, schema: { type: string, format: date } }
        - { name: sampleAuditOnly, in: query, schema: { type: boolean, default: false } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of claims waiting for the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimSummaryPage' }
              example:
                content:
                  - { id: 123, claimNumber: EXP-2026-000123, title: Mumbai client visit, status: PENDING_AUDITOR, totalAmount: 30500.00, employeeId: 101, employeeName: Asha Verma, departmentName: Engineering, submittedAt: '2026-11-27T06:15:00Z', flags: [OVER_LIMIT, WEEKEND, NO_POLICY], sampleAudit: NONE, currentLevel: AUDITOR, waitingHours: 1.2 }
                  - { id: 131, claimNumber: EXP-2026-000131, title: Bengaluru sales conference, status: PENDING_AUDITOR, totalAmount: 48250.00, employeeId: 117, employeeName: Rohan Iyer, departmentName: Sales, submittedAt: '2026-11-26T11:05:00Z', flags: [DUPLICATE], sampleAudit: NONE, currentLevel: AUDITOR, waitingHours: 20.4 }
                page: 0
                size: 20
                totalElements: 2
                totalPages: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/claims/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    post:
      tags: [Approvals]
      operationId: approveClaim
      summary: Approve at the current level (manager, delegate, auditor or head)
      x-roles: [MANAGER, AUDITOR, HEAD]
      x-story: ST-05
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveRequest' }
            example: { comment: Client visit confirmed; hotel near the client office is fine. }
      responses:
        '200':
          description: Claim after approval (next level or APPROVED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
              examples:
                pendingAuditor: { $ref: '#/components/examples/PendingAuditorClaim' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/claims/{id}/send-back:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    post:
      tags: [Approvals]
      operationId: sendBackClaim
      summary: Send back for clarification (comment required)
      x-roles: [MANAGER, AUDITOR, HEAD]
      x-story: ST-05
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendBackRequest' }
            example: { comment: Please attach the hotel invoice with GST details. }
      responses:
        '200':
          description: Claim now NEEDS_CLARIFICATION
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
              examples:
                needsClarification: { $ref: '#/components/examples/NeedsClarificationClaim' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/claims/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    post:
      tags: [Approvals]
      operationId: rejectClaim
      summary: Reject at the current level (reason required)
      x-roles: [MANAGER, AUDITOR, HEAD]
      x-story: ST-08
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
            example: { reason: Personal travel, not a business expense. }
      responses:
        '200':
          description: Claim now REJECTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
              examples:
                rejected: { $ref: '#/components/examples/RejectedClaim' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/approvals/bulk-approve:
    post:
      tags: [Approvals]
      operationId: bulkApproveClaims
      summary: Auditor bulk approve (each claim processed independently)
      x-roles: [AUDITOR]
      x-story: ST-07
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkApproveRequest' }
            example: { claimIds: [123, 131, 140], comment: Reviewed in batch. }
      responses:
        '200':
          description: Per-claim results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkApproveResponse' }
              example:
                processed: 3
                succeeded: 2
                failed: 1
                results:
                  - { claimId: 123, claimNumber: EXP-2026-000123, outcome: APPROVED, newStatus: APPROVED, errorStatus: null, errorDetail: null }
                  - { claimId: 131, claimNumber: EXP-2026-000131, outcome: APPROVED, newStatus: APPROVED, errorStatus: null, errorDetail: null }
                  - { claimId: 140, claimNumber: EXP-2026-000140, outcome: SKIPPED, newStatus: null, errorStatus: 409, errorDetail: Claim is PENDING_MANAGER, not PENDING_AUDITOR }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/claims/{id}/sample-audit:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    post:
      tags: [Approvals]
      operationId: resolveSampleAudit
      summary: Clear or fail an open sample audit (FAILED rejects the claim)
      x-roles: [AUDITOR]
      x-story: ST-07
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SampleAuditRequest' }
            example: { result: CLEARED, reason: Receipts match the amounts. }
      responses:
        '200':
          description: Claim after the sample audit decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
              examples:
                cleared: { $ref: '#/components/examples/SampleAuditClearedClaim' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/claims/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    get:
      tags: [Comments]
      operationId: listClaimComments
      summary: Comments on a claim, oldest first
      x-roles: [EMPLOYEE, MANAGER, AUDITOR, HEAD]
      x-story: ST-05
      responses:
        '200':
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comment' }
              example:
                - { id: 901, claimId: 123, authorId: 21, authorName: Vikram Nair, authorRole: MANAGER, body: Please confirm the client meeting dates., createdAt: '2026-11-27T06:40:00Z' }
                - { id: 902, claimId: 123, authorId: 101, authorName: Asha Verma, authorRole: EMPLOYEE, body: Meetings were on 18 and 19 November., createdAt: '2026-11-27T06:52:00Z' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    post:
      tags: [Comments]
      operationId: addClaimComment
      summary: Add a comment to a claim
      x-roles: [EMPLOYEE, MANAGER, AUDITOR, HEAD]
      x-story: ST-05
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentRequest' }
            example: { body: Please confirm the client meeting dates. }
      responses:
        '201':
          description: Comment added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
              example: { id: 901, claimId: 123, authorId: 21, authorName: Vikram Nair, authorRole: MANAGER, body: Please confirm the client meeting dates., createdAt: '2026-11-27T06:40:00Z' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/claims/{id}/audit:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    get:
      tags: [Audit]
      operationId: getClaimAuditTrail
      summary: Append-only audit timeline of a claim, oldest first
      x-roles: [EMPLOYEE, MANAGER, AUDITOR, HEAD]
      x-story: ST-11
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEvent' }
              example:
                - { id: 7001, actorId: 101, actorName: Asha Verma, onBehalfOfId: null, onBehalfOfName: null, action: CLAIM_CREATED, entityType: CLAIM, entityId: 123, claimId: 123, fromStatus: null, toStatus: DRAFT, details: { lines: 4 }, correlationId: 3f6c2a1e9b7d4c58, createdAt: '2026-11-27T06:05:00Z' }
                - { id: 7002, actorId: 101, actorName: Asha Verma, onBehalfOfId: null, onBehalfOfName: null, action: CLAIM_SUBMITTED, entityType: CLAIM, entityId: 123, claimId: 123, fromStatus: DRAFT, toStatus: PENDING_MANAGER, details: { flags: [OVER_LIMIT, WEEKEND, NO_POLICY], total: 30500.00 }, correlationId: 8a1d4e7f2c3b5a69, createdAt: '2026-11-27T06:15:00Z' }
                - { id: 7010, actorId: 21, actorName: Vikram Nair, onBehalfOfId: 34, onBehalfOfName: Neha Kulkarni, action: CLAIM_APPROVED, entityType: CLAIM, entityId: 123, claimId: 123, fromStatus: PENDING_MANAGER, toStatus: PENDING_AUDITOR, details: { level: MANAGER, delegated: true }, correlationId: 5b9e0c2d7a4f1e36, createdAt: '2026-11-27T07:02:00Z' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/delegations:
    get:
      tags: [Delegations]
      operationId: listMyDelegations
      summary: Delegations where the caller is approver or delegate
      x-roles: [MANAGER, AUDITOR, HEAD]
