components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID. Same key + same user returns the stored response.
      schema: { type: string, format: uuid }
      example: 6f1c2b7e-3d4a-4f8b-9c0d-1e2f3a4b5c6d
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ClaimId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
      example: 123
    BatchId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
      example: 12

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example:
            type: https://expenseflow.test/problems/validation
            title: Validation failed
            status: 400
            detail: 2 fields are invalid
            instance: /api/claims
            correlationId: 3f6c2a1e9b7d4c58
            errors:
              - { field: 'lines[0].amount', message: must be greater than 0 }
              - { field: 'lines[0].vendor', message: must not be blank }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example: { type: https://expenseflow.test/problems/unauthorized, title: Unauthorized, status: 401, detail: Missing or expired token, instance: /api/claims, correlationId: 1a2b3c4d5e6f7a8b, errors: [] }
    Forbidden:
      description: Role or action not allowed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example: { type: https://expenseflow.test/problems/forbidden, title: Forbidden, status: 403, detail: You can't approve your own claim, instance: /api/claims/145/approve, correlationId: 9c8b7a6f5e4d3c2b, errors: [] }
    NotFound:
      description: Not found or not visible to the caller
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example: { type: https://expenseflow.test/problems/not-found, title: Not found, status: 404, detail: Claim not found, instance: /api/claims/150, correlationId: 2d3e4f5a6b7c8d9e, errors: [] }
    Conflict:
      description: Invalid status transition, stale version or idempotency conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example: { type: https://expenseflow.test/problems/invalid-transition, title: Invalid status transition, status: 409, detail: Action approve is not allowed in status DRAFT, instance: /api/claims/123/approve, correlationId: 7e8f9a0b1c2d3e4f, errors: [] }
    PayloadTooLarge:
      description: File larger than 5 MB
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example: { type: https://expenseflow.test/problems/file-too-large, title: File too large, status: 413, detail: Max 5 MB, instance: /api/receipts, correlationId: 4a5b6c7d8e9f0a1b, errors: [] }
    UnsupportedMediaType:
      description: File type not allowed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example: { type: https://expenseflow.test/problems/unsupported-type, title: Unsupported file type, status: 415, detail: Only JPEG, PNG or PDF, instance: /api/receipts, correlationId: 5b6c7d8e9f0a1b2c, errors: [] }

